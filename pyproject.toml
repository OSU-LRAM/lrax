[project]
name = "lrax"
version = "0.1.0"
description = "A collection of JAX modules used by LRAM for robotics learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax[cuda]>=0.10.2; sys_platform != 'darwin'",
    "jax>=0.10.2; sys_platform == 'darwin'",
    "jaxtyping>=0.3.11",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "optax>=0.2.8",
    "pyyaml>=6.0.3",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
mjx = ["mujoco-mjx>=3.10.0"]

[tool.ruff.lint]
ignore = ["F722", "F821", "E731", "F811"]
