[build-system]
requires = ["flit_core >=3.8.0,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lrax"
version = "0.1.0"
description = "JAX library for robotics learning research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.10.2",
    "jaxtyping>=0.3.11",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "optax>=0.2.8",
    "optimistix>=0.1.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.0",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda]>=0.10.2; sys_platform != 'darwin'"]

[tool.ruff.lint]
ignore = ["F722", "F821", "E731", "F811"]

[tool.basedpyright]
typeCheckingMode = "standard"
enableTypeIgnoreComments = true
reportMissingTypeStubs = "none"
